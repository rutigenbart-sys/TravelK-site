<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка Travel&K</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mut:#6b7885;--line:#dde3e9;--br:#e8590c;--br2:#c2410c;--ok:#15803d;--bad:#b91c1c;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-size:15px}
.btn{border:0;background:var(--br);color:#fff;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--br2)}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{background:#f0f3f6}
.btn.s{padding:5px 10px;font-size:13px}
.btn.d{background:#fff;color:var(--bad);border:1px solid #f1c5c5}
.btn[disabled]{opacity:.5;cursor:default}
.hide{display:none!important}
#login{max-width:420px;margin:12vh auto;padding:0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.err{color:var(--bad);margin:8px 0}
.hint{color:var(--mut);font-size:13px}
#top{position:sticky;top:0;z-index:20;background:#14202b;color:#fff;display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap}
#top b{font-size:16px}
#top .sp{flex:1}
#st{font-size:13px;opacity:.85}
#tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px 0;max-width:1100px;margin:0 auto}
#tabs button{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:9px 9px 0 0;cursor:pointer}
#tabs button.on{background:var(--br);color:#fff;border-color:var(--br)}
#main{max-width:1100px;margin:0 auto;padding:0 14px 80px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
.row>.n{flex:0 0 auto;min-width:0}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:#fff}
.item.off{opacity:.55;background:#f7f7f7}
.item .hd{display:flex;gap:8px;align-items:center}
.item .hd .t{flex:1;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.item .hd .t small{color:var(--mut);font-weight:400;margin-left:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#e5e9ee;color:#444}
.tag.on{background:#dcfce7;color:var(--ok)}
.tag.off{background:#fee2e2;color:var(--bad)}
.tag.chg{background:#fef3c7;color:#92400e}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.ph{width:140px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph img{width:100%;height:105px;object-fit:cover;display:block;background:#eee}
.ph .b{display:flex;justify-content:space-between;padding:4px}
.ph .c{font-size:11px;text-align:center;background:var(--br);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar input[type=search]{max-width:280px}
.bar select{max-width:220px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14202b;color:#fff;padding:11px 18px;border-radius:10px;z-index:50;max-width:90vw}
.toast.bad{background:var(--bad)}
.hist{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist .m{flex:1;min-width:0}
.hist .m small{color:var(--mut);display:block}
.crumb{margin:0 0 12px}
.crumb a{color:var(--br2);cursor:pointer}
</style>
</head>
<body>

<div id="login" class="hide"><div class="box" id="loginbox"></div></div>

<div id="app" class="hide">
  <div id="top"><b>Travel&amp;K · админка</b><span id="st"></span><span class="sp"></span>
    <button class="btn g s" id="btn-site">Открыть сайт</button>
    <button class="btn" id="btn-save" disabled>Сохранить</button>
    <button class="btn g s" id="btn-out">Выйти</button></div>
  <div id="tabs"></div>
  <div id="main"><div class="pane" id="pane"></div></div>
</div>

<script>
'use strict';
/* ====================================================================
   Конфиг. Пароль админа расшифровывает токен GitHub, лежащий в admin/vault.json.
   ==================================================================== */
var CFG = {repo: 'rutigenbart-sys/TravelK-site', branch: 'main', api: 'https://api.github.com', site: 'https://travelk.shop/'};
(function () {   // переопределение только для локальных тестов
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    var q = new URLSearchParams(location.search);
    if (q.get('api')) CFG.api = q.get('api');
    if (q.get('branch')) CFG.branch = q.get('branch');
    if (q.get('repo')) CFG.repo = q.get('repo');
    CFG.site = location.origin + '/';
  }
})();

var $ = function (s, r) { return (r || document).querySelector(s); };
function h(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach(function (x) { add(e, x); });
  else e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
function toast(msg, bad) {
  var t = h('div', {class: 'toast' + (bad ? ' bad' : '')}, msg);
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, bad ? 6000 : 2600);
}

/* ====================================================================
   Шифрование токена паролем (PBKDF2 + AES-GCM)
   ==================================================================== */
var enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); }
function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function deriveKey(pass, salt, iter) {
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (k) {
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256'}, k, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  });
}
function sealToken(token, pass) {
  var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 300000;
  return deriveKey(pass, salt, iter).then(function (key) {
    return crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, key, enc.encode(token));
  }).then(function (ct) { return {v: 1, iter: iter, salt: b64(salt), iv: b64(iv), ct: b64(ct)}; });
}
function openToken(v, pass) {
  return deriveKey(pass, unb64(v.salt), v.iter).then(function (key) {
    return crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.iv)}, key, unb64(v.ct));
  }).then(function (pt) { return dec.decode(pt); });
}

/* ====================================================================
   GitHub API
   ==================================================================== */
var TOKEN = '';
function gh(path, opt) {
  opt = opt || {};
  var headers = {'Authorization': 'Bearer ' + TOKEN, 'Accept': opt.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
  if (opt.body) headers['Content-Type'] = 'application/json';
  return fetch(CFG.api + '/repos/' + CFG.repo + path, {method: opt.method || 'GET', headers: headers, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store'}).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { var e = new Error('GitHub ' + r.status + ': ' + t.slice(0, 200)); e.status = r.status; throw e; });
    return opt.raw ? r.text() : r.json();
  });
}
function pool(items, n, fn) {
  var i = 0, res = [];
  function next() { if (i >= items.length) return Promise.resolve(); var k = i++; return fn(items[k], k).then(function (r) { res[k] = r; return next(); }); }
  var ws = []; for (var j = 0; j < Math.min(n, items.length); j++) ws.push(next());
  return Promise.all(ws).then(function () { return res; });
}

/* ====================================================================
   Состояние: файлы data/*.json в памяти, изменённые помечаются dirty
   ==================================================================== */
var S = {head: null, tree: {}, files: {}, dirty: {}, images: {}, treeSha: null};

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function loadAll(progress) {
  return gh('/git/ref/heads/' + CFG.branch).then(function (ref) {
    S.head = ref.object.sha;
    return gh('/git/commits/' + S.head);
  }).then(function (c) {
    S.treeSha = c.tree.sha;
    return gh('/git/trees/' + c.tree.sha + '?recursive=1');
  }).then(function (t) {
    var list = t.tree.filter(function (x) { return x.type === 'blob'; });
    S.tree = {}; list.forEach(function (x) { S.tree[x.path] = x.sha; });
    var jsons = list.filter(function (x) { return /^data\/.+\.json$/.test(x.path); });
    var done = 0;
    S.files = {}; S.dirty = {}; S.images = {};
    return pool(jsons, 8, function (f) {
      var cached = lsGet('tkb:' + f.sha);
      var p = cached ? Promise.resolve(cached) : gh('/git/blobs/' + f.sha, {accept: 'application/vnd.github.raw+json', raw: true}).then(function (txt) { lsSet('tkb:' + f.sha, txt); return txt; });
      return p.then(function (txt) { S.files[f.path] = JSON.parse(txt); progress && progress(++done, jsons.length); });
    });
  });
}

function touch(path) { S.dirty[path] = true; refreshSave(); }
function drop(path) { S.dirty[path] = null; delete S.files[path]; refreshSave(); }
function dirtyCount() { return Object.keys(S.dirty).length + Object.keys(S.images).length; }
function refreshSave() {
  var n = Object.keys(S.dirty).length;
  var b = $('#btn-save');
  b.disabled = !n; b.textContent = n ? 'Сохранить (' + n + ')' : 'Сохранить';
  $('#st').textContent = n ? 'Есть несохранённые изменения' : '';
}
window.addEventListener('beforeunload', function (e) { if (Object.keys(S.dirty).length) { e.preventDefault(); e.returnValue = ''; } });

function clean(k, v) { return k === '__open' ? undefined : v; }
function jsonOut(o) { return JSON.stringify(o, clean, 1) + '\n'; }

function commit(message, entries) {
  // entries: [{path, content|blobSha|delete}]  — атомарный коммит через Git Data API
  return gh('/git/ref/heads/' + CFG.branch).then(function (ref) {
    var head = ref.object.sha;
    return gh('/git/commits/' + head).then(function (c) {
      var tree = entries.map(function (en) {
        if (en.del) return {path: en.path, mode: '100644', type: 'blob', sha: null};
        if (en.treeSha) return {path: en.path, mode: '040000', type: 'tree', sha: en.treeSha};
        if (en.blobSha) return {path: en.path, mode: '100644', type: 'blob', sha: en.blobSha};
        return {path: en.path, mode: '100644', type: 'blob', content: en.content};
      });
      return gh('/git/trees', {method: 'POST', body: {base_tree: c.tree.sha, tree: tree}}).then(function (nt) {
        return gh('/git/commits', {method: 'POST', body: {message: message, tree: nt.sha, parents: [head]}});
      });
    });
  }).then(function (nc) {
    return gh('/git/refs/heads/' + CFG.branch, {method: 'PATCH', body: {sha: nc.sha}}).then(function () { return nc.sha; });
  });
}

function save() {
  var btn = $('#btn-save'); btn.disabled = true; btn.textContent = 'Сохраняю…';
  var paths = Object.keys(S.dirty);
  var imgs = Object.keys(S.images);
  var ent = [];
  // картинки → blobs
  return pool(imgs, 3, function (p) {
    return gh('/git/blobs', {method: 'POST', body: {content: S.images[p].b64, encoding: 'base64'}}).then(function (b) { ent.push({path: p, blobSha: b.sha}); });
  }).then(function () {
    paths.forEach(function (p) {
      if (S.dirty[p] === null) ent.push({path: p, del: true});
      else ent.push({path: p, content: jsonOut(S.files[p])});
    });
    var names = [];
    paths.forEach(function (p) { names.push(p.replace(/^data\//, '').replace(/\.json$/, '')); });
    var msg = 'Админка: ' + names.slice(0, 4).join(', ') + (names.length > 4 ? ' и ещё ' + (names.length - 4) : '') + (imgs.length ? ' (+' + imgs.length + ' фото)' : '');
    return commit(msg, ent);
  }).then(function (sha) {
    S.head = sha; S.dirty = {}; S.images = {};
    refreshSave();
    toast('Сохранено. Сайт обновится через 1–2 минуты.');
    watchBuild(sha);
    return sha;
  }).catch(function (e) {
    refreshSave(); toast('Не удалось сохранить: ' + e.message, true); throw e;
  });
}

/* статус публикации (нужно право Actions: read; если его нет — молча пропускаем) */
function watchBuild(sha) {
  var tries = 0, st = $('#st');
  st.textContent = '⏳ Публикуется на сайт…';
  function tick() {
    if (++tries > 40) { st.textContent = ''; return; }
    gh('/actions/runs?head_sha=' + sha + '&per_page=5').then(function (r) {
      var run = (r.workflow_runs || [])[0];
      if (!run) return setTimeout(tick, 4000);
      if (run.status === 'completed') {
        if (run.conclusion === 'success') { st.textContent = '✅ Опубликовано на сайте'; setTimeout(function () { if (!Object.keys(S.dirty).length) st.textContent = ''; }, 12000); }
        else { st.textContent = '❌ Ошибка публикации — сайт не обновился, проверьте последнюю правку'; toast('Ошибка сборки сайта. Откройте «История» и откатите последнюю правку.', true); }
      } else setTimeout(tick, 4000);
    }).catch(function () { st.textContent = 'Сайт обновится через 1–2 минуты'; });
  }
  setTimeout(tick, 3000);
}

/* ====================================================================
   Картинки: ресайз и сжатие в браузере → webp
   ==================================================================== */
function processImage(file, w, hgt) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var c = document.createElement('canvas'); c.width = w; c.height = hgt;
      var g = c.getContext('2d'), sr = im.width / im.height, dr = w / hgt, sx = 0, sy = 0, sw = im.width, sh = im.height;
      if (sr > dr) { sw = im.height * dr; sx = (im.width - sw) / 2; } else { sh = im.width / dr; sy = (im.height - sh) / 2; }
      g.drawImage(im, sx, sy, sw, sh, 0, 0, w, hgt);
      c.toBlob(function (blob) {
        URL.revokeObjectURL(url);
        if (!blob) return rej(new Error('Не удалось обработать фото'));
        var fr = new FileReader();
        fr.onload = function () { res({b64: String(fr.result).split(',')[1], preview: fr.result, type: blob.type}); };
        fr.readAsDataURL(blob);
      }, 'image/webp', 0.82);
    };
    im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Это не картинка')); };
    im.src = url;
  });
}
function uploadPhoto(file, base, w, hgt) {
  return processImage(file, w || 1000, hgt || 750).then(function (r) {
    var path = 'img/u/' + base.replace(/[^a-z0-9-]/gi, '').slice(0, 40) + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + '.webp';
    S.images[path] = r; refreshSave();
    $('#btn-save').disabled = false;
    return path;
  });
}
function imgSrc(path) {
  if (S.images[path]) return S.images[path].preview;
  return CFG.site + path;
}
function pickFiles(multi) {
  return new Promise(function (res) {
    var i = h('input', {type: 'file', accept: 'image/*', multiple: !!multi, style: 'display:none'});
    i.addEventListener('change', function () { res([].slice.call(i.files)); i.remove(); });
    document.body.appendChild(i); i.click();
  });
}

/* ====================================================================
   Вспомогательное: транслит, поля форм
   ==================================================================== */
var TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
function slugify(s) {
  var o = ''; s.toLowerCase().split('').forEach(function (c) { o += TR[c] != null ? TR[c] : c; });
  return o.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'item';
}
function uniq(base, taken) { var s = base, i = 2; while (taken.indexOf(s) >= 0) s = base + '-' + (i++); return s; }

/* поле, привязанное к obj[key]; onchange вызывается после изменения */
function F(label, obj, key, o) {
  o = o || {};
  var type = o.type || 'text', inp;
  var cb = function () { if (o.on) o.on(); (o.touch || function () {})(); };
  if (type === 'area') inp = h('textarea', {rows: o.rows || 4});
  else if (type === 'select') {
    inp = h('select');
    o.options.forEach(function (op) { inp.appendChild(h('option', {value: op[0]}, op[1])); });
  } else if (type === 'bool') {
    inp = h('input', {type: 'checkbox'});
    inp.checked = !!obj[key];
    inp.addEventListener('change', function () { obj[key] = inp.checked; cb(); });
    return h('label', {style: 'display:flex;gap:8px;align-items:center;color:var(--ink)'}, inp, label);
  } else inp = h('input', {type: type === 'num' ? 'number' : 'text'});
  var val = obj[key];
  if (type === 'select') inp.value = val == null ? '' : val; else inp.value = val == null ? '' : val;
  inp.addEventListener('input', function () {
    var v = inp.value;
    if (type === 'num') v = v === '' ? 0 : Number(v);
    obj[key] = v; cb();
  });
  if (type === 'select') inp.addEventListener('change', function () { obj[key] = inp.value; cb(); });
  return h('label', null, label, inp);
}

/* фото одной картинки (для главной/блога) */
function ImgField(label, obj, key, base, w, hgt, tch) {
  var wrap = h('div'), pv = h('img', {style: 'width:160px;height:' + Math.round(160 * (hgt || 750) / (w || 1000)) + 'px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin:4px 0;background:#eee'});
  function draw() { pv.src = obj[key] ? imgSrc(obj[key]) : ''; pv.style.visibility = obj[key] ? 'visible' : 'hidden'; }
  draw();
  wrap.appendChild(h('div', {class: 'hint'}, label));
  wrap.appendChild(pv);
  wrap.appendChild(h('button', {class: 'btn g s', onclick: function () {
    pickFiles(false).then(function (fs) { if (!fs[0]) return; return uploadPhoto(fs[0], base, w, hgt).then(function (p) { obj[key] = p; draw(); tch(); }); }).catch(function (e) { toast(e.message, true); });
  }}, 'Заменить фото'));
  return wrap;
}

/* общий редактор списка объектов */
function ListEditor(arr, o) {
  // o: title(item)->string, sub(item), fields(item, redraw)->nodes, make()->item, touch(), pub(true/false), label
  var root = h('div');
  function draw() {
    root.innerHTML = '';
    arr.forEach(function (it, i) {
      var openKey = it.__open;
      var body = h('div', {class: openKey ? '' : 'hide', style: 'margin-top:10px'});
      var hd = h('div', {class: 'hd'},
        h('span', {class: 't', onclick: function () { it.__open = !it.__open; body.classList.toggle('hide'); if (!body.firstChild) fill(); }}, o.title(it), o.sub ? h('small', null, o.sub(it)) : null),
        o.pub !== false ? h('span', {class: 'tag ' + (it.published === false ? 'off' : 'on')}, it.published === false ? 'скрыто' : 'виден') : null,
        h('button', {class: 'btn g s', title: 'Выше', onclick: function () { move(i, -1); }}, '↑'),
        h('button', {class: 'btn g s', title: 'Ниже', onclick: function () { move(i, 1); }}, '↓'));
      var box = h('div', {class: 'item' + (it.published === false ? ' off' : '')}, hd, body);
      function fill() {
        body.innerHTML = '';
        add(body, o.fields(it, draw));
        var act = h('div', {class: 'bar'});
        if (o.pub !== false) act.appendChild(h('button', {class: 'btn g s', onclick: function () { it.published = it.published === false; o.touch(); draw(); }}, it.published === false ? 'Показать на сайте' : 'Скрыть с сайта'));

/* ====================================================================
   Разметка текста экскурсии: ## заголовок, ### подзаголовок, - список, ! заметка, пустая строка между абзацами
   ==================================================================== */
function toMarkup(blocks, extra) {
  var out = [];
  blocks.forEach(function (b) {
    if (b.t === 'h2') out.push('## ' + b.x);
    else if (b.t === 'h3') out.push('### ' + b.x);
    else if (b.t === 'p') out.push(b.x);
    else if (b.t === 'note' && !b.style) out.push('! ' + b.x);
    else if (b.t === 'ul') out.push(b.x.map(function (i) { return '- ' + i; }).join('\n'));
    else { extra.push(b); out.push('[[особый блок ' + extra.length + ']]'); }
  });
  return out.join('\n\n');
}
function fromMarkup(text, extra) {
  var blocks = [], paras = text.replace(/\r/g, '').split(/\n{2,}/);
  paras.forEach(function (p) {
    p = p.replace(/^\n+|\n+$/g, ''); if (!p.trim()) return;
    var m;
    if ((m = /^\[\[особый блок (\d+)\]\]$/.exec(p.trim()))) { var x = extra[+m[1] - 1]; if (x) blocks.push(x); return; }
    var lines = p.split('\n');
    var cur = null;
    lines.forEach(function (ln) {
      if (/^### /.test(ln)) { blocks.push({t: 'h3', x: ln.slice(4)}); cur = null; }
      else if (/^## /.test(ln)) { blocks.push({t: 'h2', x: ln.slice(3)}); cur = null; }
      else if (/^! /.test(ln)) { blocks.push({t: 'note', x: ln.slice(2)}); cur = null; }
      else if (/^- /.test(ln)) { if (!cur || cur.t !== 'ul') { cur = {t: 'ul', x: []}; blocks.push(cur); } cur.x.push(ln.slice(2)); }
      else { if (cur && cur.t === 'p') cur.x += '\n' + ln; else { cur = {t: 'p', x: ln}; blocks.push(cur); } }
    });
  });
  return blocks;
}
function BodyEditor(t, tch) {
  var extra = [], ta = h('textarea', {rows: 18, style: 'font-family:ui-monospace,Menlo,monospace;font-size:13px'});
  ta.value = toMarkup(t.body, extra);
  ta.addEventListener('input', function () { t.body = fromMarkup(ta.value, extra); tch(); });
  return h('div', null,
    h('div', {class: 'hint'}, 'Пишите обычным текстом. «## Заголовок», «### Подзаголовок», «- пункт списка», «! примечание». Абзацы разделяйте пустой строкой. Блоки «[[особый блок N]]» (таблицы, врезки) не трогайте — они сохранятся как есть.'),
    ta);
}
function RawBody(p, tch) {   // блог: тот же текст, но можно HTML
  var ta = h('textarea', {rows: 18, style: 'font-family:ui-monospace,Menlo,monospace;font-size:13px'});
  ta.value = toMarkup(p.body, []);
  ta.addEventListener('input', function () { p.body = fromMarkup(ta.value, []); tch(); });
  return h('div', null, h('div', {class: 'hint'}, '«## Заголовок», «- пункт списка», абзацы через пустую строку.'), ta);
}

        try { sessionStorage.setItem('tk_t', TOKEN); } catch (e) {}
        startApp();
      }).catch(function (e) { TOKEN = ''; b.disabled = false; b.textContent = 'Сохранить и войти'; fail(e.message); });
    }}, 'Сохранить и войти'));
  }
}

function fetchVault() {
  var local = lsGet('tk_vault'); var tries = [];
  tries.push(fetch('vault.json?v=' + Date.now(), {cache: 'no-store'}).then(function (r) { if (!r.ok) throw 0; return r.json(); }));
  return tries[0].catch(function () {
    return fetch('https://raw.githubusercontent.com/' + CFG.repo + '/' + CFG.branch + '/admin/vault.json', {cache: 'no-store'}).then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }).catch(function () { return local ? JSON.parse(local) : null; });
}

$('#btn-save').addEventListener('click', function () { save().catch(function () {}); });
$('#btn-out').addEventListener('click', logout);
$('#btn-site').addEventListener('click', function () { window.open(CFG.site, '_blank'); });

(function boot() {
  var tok = null; try { tok = sessionStorage.getItem('tk_t'); } catch (e) {}
  if (tok) { TOKEN = tok; return startApp(); }
  fetchVault().then(function (v) { showLogin(v ? 'login' : 'setup', v); });
})();
</script>
</body>
</html>
